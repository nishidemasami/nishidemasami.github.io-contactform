components:
  schemas:
    CreateInquiryRequest:
      properties:
        body:
          type: string
        subject:
          type: string
      required:
      - subject
      - body
      type: object
    CreateInquiryResponse:
      properties:
        inquiry:
          $ref: '#/components/schemas/Inquiry'
      required:
      - inquiry
      type: object
    ErrorResponse:
      properties:
        error:
          type: string
        message:
          type: string
      required:
      - error
      - message
      type: object
    Inquiry:
      properties:
        body:
          type: string
        cognito_sub:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        subject:
          type: string
      required:
      - id
      - cognito_sub
      - email
      - subject
      - body
      - created_at
      type: object
    InquiryListResponse:
      properties:
        count:
          format: int64
          minimum: 0
          type: integer
        email:
          type: string
        inquiries:
          items:
            $ref: '#/components/schemas/Inquiry'
          type: array
      required:
      - email
      - count
      - inquiries
      type: object
  securitySchemes:
    CognitoAuthorizer:
      flows: {}
      type: oauth2
      x-amazon-apigateway-authorizer:
        identitySource: $request.header.Authorization
        jwtConfiguration:
          audience:
          - exampleclientid
          issuer: https://cognito-idp.ap-northeast-3.amazonaws.com/ap-northeast-3_example
        type: jwt
info:
  description: ''
  license:
    name: ''
  title: api_handler
  version: 0.1.0
openapi: 3.1.0
paths:
  /inquiries:
    get:
      operationId: get_inquiries
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryListResponse'
          description: Get inquiries
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - CognitoAuthorizer: []
      tags: []
    post:
      operationId: post_inquiry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInquiryResponse'
          description: Create inquiry
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - CognitoAuthorizer: []
      tags: []
servers:
- url: https://example.execute-api.ap-northeast-3.amazonaws.com
