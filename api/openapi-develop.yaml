components:
  schemas:
    CreateInquiryRequest:
      properties:
        body:
          type: string
        subject:
          type: string
      required:
      - subject
      - body
      type: object
    CreateInquiryResponse:
      properties:
        inquiry:
          $ref: '#/components/schemas/Inquiry'
      required:
      - inquiry
      type: object
    ErrorResponseBody:
      properties:
        error:
          type: string
        message:
          type: string
      required:
      - error
      - message
      type: object
    Inquiry:
      properties:
        body:
          type: string
        cognito_sub:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        subject:
          type: string
      required:
      - id
      - cognito_sub
      - email
      - subject
      - body
      - created_at
      type: object
    InquiryListResponse:
      properties:
        count:
          format: int64
          minimum: 0
          type: integer
        email:
          type: string
        inquiries:
          items:
            $ref: '#/components/schemas/Inquiry'
          type: array
      required:
      - email
      - count
      - inquiries
      type: object
  securitySchemes:
    CognitoAuthorizer:
      bearerFormat: JWT
      scheme: bearer
      type: http
      x-amazon-apigateway-authorizer:
        identitySource: $request.header.Authorization
        jwtConfiguration:
          audience:
          - 10e3ku62o0cm6n1gt2h65s1u9t
          issuer: https://cognito-idp.ap-northeast-3.amazonaws.com/ap-northeast-3_kZfu7imK2
        type: jwt
info:
  description: API for contact form inquiries.
  license:
    name: Proprietary
  title: Contact Form API
  version: 0.1.0
openapi: 3.0.1
paths:
  /inquiries:
    get:
      operationId: handle_get_inquiries
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryListResponse'
          description: Get inquiries
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody'
          description: Internal server error
      security:
      - CognitoAuthorizer: []
      - BearerAuth: []
      tags:
      - inquiries
    post:
      operationId: handle_post_inquiry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInquiryResponse'
          description: Create inquiry
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody'
          description: Internal server error
      security:
      - CognitoAuthorizer: []
      - BearerAuth: []
      tags:
      - inquiries
servers:
- url: https://v3bc42brtj.execute-api.ap-northeast-3.amazonaws.com
