name: CI/CD - Cognito Deployment

on:
  push:
    branches:
      - develop
      - release
    paths:
      - '.github/workflows/cognito_cicd.yaml'
      - "infrastructure/auth/**"
  pull_request:
    branches:
      - main
      - develop
      - release
    paths:
      - '.github/workflows/cognito_cicd.yaml'
      - "infrastructure/auth/**"
  workflow_dispatch:

env:
  STACKNAME_PREFIX: snngicf
  AWS_REGION: ap-northeast-3
  SAM_TEMPLATE: infrastructure/auth/template.yaml

jobs:
  validate:
    name: Validate SAM Template
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Validate SAM template
        run: |
          sam validate --template ${{ env.SAM_TEMPLATE }} --lint

  deploy:
    name: Deploy Cognito Resources
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Cognito resources
        id: deploy
        run: |
          sam deploy \
            --template ${{ env.SAM_TEMPLATE }} \
            --stack-name ${{ env.STACKNAME_PREFIX }}-auth-${{ github.ref_name }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides Stage=${{ github.ref_name }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3
