name: CI/CD - API Deployment

on:
  push:
    branches:
      - develop
      - release
    paths:
      - '.github/workflows/api_cicd.yaml'
      - 'api/**'
  pull_request:
    branches:
      - main
      - develop
      - release
    paths:
      - '.github/workflows/api_cicd.yaml'
      - 'api/**'
  workflow_dispatch:

env:
  STACKNAME_PREFIX: snngicf
  AWS_REGION: ap-northeast-3
  SAM_TEMPLATE: api/template.yaml

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Validate SAM template
        run: |
          sam validate --template ${{ env.SAM_TEMPLATE }} --lint

      - name: Start local PostgreSQL for Rust tests
        run: |
          docker run --name contactform-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            -d postgres:16.13
          until docker exec contactform-postgres pg_isready -U postgres -d postgres; do
            sleep 1
          done

      - name: Run Liquibase migrations for local test DB
        run: |
          docker run --rm \
            -e LIQUIBASE_HUB_MODE=off \
            --network host \
            -v "${{ github.workspace }}:/workspace" \
            liquibase/liquibase:4.33.0 \
            --search-path=/workspace \
            --changelog-file=infrastructure/liquibase_migrate/changelog.xml \
            --contexts=local \
            --url=jdbc:postgresql://localhost:5432/postgres \
            --username=postgres \
            --password=postgres \
            update

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api/lambda
          cache-on-failure: true

      - name: Validate OpenAPI generation
        working-directory: api/lambda
        env:
          OPENAPI_OUTPUT: /tmp/openapi-validate.yaml
          API_ENDPOINT: https://placeholder.execute-api.ap-northeast-3.amazonaws.com
          USER_POOL_ID: ap-northeast-3_placeholder
          CLIENT_ID: placeholder
        run: cargo run --features openapi --bin generate-openapi

      - name: Check Rust code
        working-directory: api/lambda
        run: cargo check

      - name: Run Rust tests
        working-directory: api/lambda
        run: cargo test -- --include-ignored

      # `cargo test --doc` only works for library targets. `api/lambda` is a binary-only crate, this step will always fail even when normal tests pass.
      # - name: Run Rust documentation tests
      #   working-directory: api/lambda
      #   run: cargo test --doc

      - name: Get cargo-tarpaulin version
        id: tarpaulin-version
        run: |
          VERSION=$(cargo-tarpaulin --version | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Cache cargo-tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ runner.os }}-${{ steps.tarpaulin-version.outputs.version }}

      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin

      - name: Run Rust tests with coverage
        working-directory: api/lambda
        run: cargo tarpaulin --out Html -- --include-ignored

      - name: Upload coverage report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/lambda/tarpaulin-report.html

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api/lambda
          cache-on-failure: true

      - name: Install cargo-lambda
        run: |
          pip install cargo-lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda function
        run: |
          sam build --template ${{ env.SAM_TEMPLATE }}

      - name: Deploy API resources
        id: deploy
        run: |
          sam deploy \
            --template .aws-sam/build/template.yaml \
            --stack-name ${{ env.STACKNAME_PREFIX }}-api-${{ github.ref_name }} \
            --capabilities CAPABILITY_IAM \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides Stage=${{ github.ref_name }}  \
              StackNamePrefix=${{ env.STACKNAME_PREFIX }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3

  export_openapi:
    name: Export OpenAPI Definition
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: deploy
    if: github.event_name != 'pull_request'
    # Note: You need to configure the workflow permissions to allow GitHub Actions to create Deployments. This can be done in the repository settings under Actions > General > Workflow permissions.
    # Workflow permissions
    # ✔Read and write permissions
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api/lambda
          cache-on-failure: true

      - name: Get Cognito and API endpoint values
        id: cognito
        run: |
          USER_POOL_ID=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${{ env.STACKNAME_PREFIX }}-auth-${{ github.ref_name }}-CognitoUserPoolId'].Value" \
            --output text)
          echo "USER_POOL_ID=$USER_POOL_ID" >> $GITHUB_OUTPUT

          CLIENT_ID=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${{ env.STACKNAME_PREFIX }}-auth-${{ github.ref_name }}-CognitoUserPoolClientId'].Value" \
            --output text)
          echo "CLIENT_ID=$CLIENT_ID" >> $GITHUB_OUTPUT

          API_ENDPOINT=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${{ env.STACKNAME_PREFIX }}-api-${{ github.ref_name }}-HttpApiUrl-${{ github.ref_name }}'].Value" \
            --output text)
          echo "API_ENDPOINT=$API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Export OpenAPI definition
        working-directory: api/lambda
        env:
          OPENAPI_OUTPUT: ../../_output/openapi-${{ github.ref_name }}.yaml
          API_ENDPOINT: ${{ steps.cognito.outputs.API_ENDPOINT }}
          USER_POOL_ID: ${{ steps.cognito.outputs.USER_POOL_ID }}
          CLIENT_ID: ${{ steps.cognito.outputs.CLIENT_ID }}
        run: cargo run --features openapi --bin generate-openapi

      - name: Generate RapiDoc HTML viewer
        run: |
          echo '<!doctype html><meta charset="utf-8"><script src="https://unpkg.com/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script><script src="https://unpkg.com/rapidoc@9.3.8/dist/rapidoc-min.js"></script><body><rapi-doc style="visibility: visible" id="doc" spec-url="./openapi-${{ github.ref_name }}.yaml" render-style="read" allow-try="true" allow-authentication="true" persist-auth="true" theme="dark" show-header="false" api-key-name="Authorization" api-key-location="header" api-key-value="eyJ..."></rapi-doc></body></html>' > _output/index.html

      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'openapi-${{ github.ref_name }}',
              required_contexts: [],
              auto_merge: false,
              description: 'Deploy OpenAPI definition'
            })
            core.setOutput('deployment_id', res.data.id)

      - name: Deploy CloudFlare Pages
        id: deploy_pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_APITOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
          command: pages deploy _output --project-name=${{ secrets.CLOUDFLARE_PROJECTNAME_API }}

      - name: Update GitHub Deployment status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: '${{ steps.deploy_pages.outputs.deployment-url }}'
            })

      - name: Mark deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure'
            })

  publish_coverage:
    name: Publish Coverage Report
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: validate
    # Note: You need to configure the workflow permissions to allow GitHub Actions to create Deployments. This can be done in the repository settings under Actions > General > Workflow permissions.
    # Workflow permissions
    # ✔Read and write permissions
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4.1.3
        with:
          name: coverage-report
          path: _output/coverage/

      - name: Rename coverage report to index.html
        run: mv _output/coverage/tarpaulin-report.html _output/coverage/index.html

      - name: Delete existing release (if develop-coverage-report exists)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: "develop-coverage-report"
              });
      
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id
              });
      
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/develop-coverage-report"
              });
            } catch (e) {
              core.info("No existing release");
            }

      - name: Create Release (develop-coverage-report)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: develop-coverage-report
          name: develop build
          files: _output/coverage/index.html

      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'coverage-${{ github.ref_name }}',
              required_contexts: [],
              auto_merge: false,
              description: 'Deploy coverage report'
            })
            core.setOutput('deployment_id', res.data.id)

      - name: Deploy CloudFlare Pages
        id: deploy_pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_APITOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
          command: pages deploy _output/coverage --project-name=${{ secrets.CLOUDFLARE_PROJECTNAME_API }} --branch=coverage

      - name: Update GitHub Deployment status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: '${{ steps.deploy_pages.outputs.deployment-url }}'
            })

      - name: Mark deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure'
            })
