name: CI/CD - API Deployment

on:
  push:
    branches:
      - develop
      - release
    paths:
      - '.github/workflows/api_cicd.yaml'
      - 'api/**'
  pull_request:
    branches:
      - main
      - develop
      - release
    paths:
      - '.github/workflows/api_cicd.yaml'
      - 'api/**'
  workflow_dispatch:

env:
  STACKNAME_PREFIX: snngicf
  AWS_REGION: ap-northeast-3
  SAM_TEMPLATE: api/template.yaml

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Validate SAM template
        run: |
          sam validate --template ${{ env.SAM_TEMPLATE }} --lint

      - name: Start local PostgreSQL for Rust tests
        run: |
          docker run --name contactform-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            -d postgres:16.13
          until docker exec contactform-postgres pg_isready -U postgres -d postgres; do
            sleep 1
          done

      - name: Run Liquibase migrations for local test DB
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/workspace" \
            liquibase/liquibase:4.33.0 \
            --search-path=/workspace \
            --hub-mode=off \
            --changelog-file=infrastructure/liquibase_migrate/changelog.xml \
            --contexts=local \
            --url=jdbc:postgresql://localhost:5432/postgres \
            --username=postgres \
            --password=postgres \
            update

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api/lambda
          cache-on-failure: true

      - name: Check Rust code
        working-directory: api/lambda
        run: cargo check

      - name: Run Rust tests
        working-directory: api/lambda
        run: cargo test -- --include-ignored

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api/lambda
          cache-on-failure: true

      - name: Install cargo-lambda
        run: |
          pip install cargo-lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda function
        run: |
          sam build --template ${{ env.SAM_TEMPLATE }}

      - name: Deploy API resources
        id: deploy
        run: |
          sam deploy \
            --template .aws-sam/build/template.yaml \
            --stack-name ${{ env.STACKNAME_PREFIX }}-api-${{ github.ref_name }} \
            --capabilities CAPABILITY_IAM \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides Stage=${{ github.ref_name }}  \
              StackNamePrefix=${{ env.STACKNAME_PREFIX }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3

  export_openapi:
    name: Export OpenAPI Definition
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: deploy
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API ID from CloudFormation
        id: api_outputs
        run: |
          API_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACKNAME_PREFIX }}-api-${{ github.ref_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiId'].OutputValue" \
            --output text)
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "Error: CloudFormation output 'HttpApiId' is missing or not available for stack ${{ env.STACKNAME_PREFIX }}-api-${{ github.ref_name }}." >&2
            exit 1
          fi
          echo "API_ID=$API_ID" >> "$GITHUB_OUTPUT"

      - name: Export OpenAPI definition
        run: |
          aws apigatewayv2 export-api \
            --api-id ${{ steps.api_outputs.outputs.API_ID }} \
            --output-type YAML \
            --specification OAS30 \
            --stage-name '$default' \
            api/openapi-${{ github.ref_name }}.yaml

      - name: Check for changes
        id: changes
        run: |
          git add api/openapi-${{ github.ref_name }}.yaml
          git diff --cached --quiet api/openapi-${{ github.ref_name }}.yaml \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and create pull request for OpenAPI definition
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          BRANCH="openapi-update-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -B "$BRANCH"
          git commit -m "chore: auto-generate OpenAPI definition from API Gateway [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: auto-generate OpenAPI definition from API Gateway" \
            --body "Automated OpenAPI definition update generated by the CI/CD workflow." \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH"
