name: Update LLM Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: pnpm setup & configure pnpm global bin path
        run: |
          pnpm setup
          source ~/.bashrc
          echo "$(pnpm bin -g)" >> "$GITHUB_PATH"

      - name: Install GitHub Copilot CLI
        run: pnpm add -g @github/copilot

      # Note: You need to create a personal access token with repo scope and add it as a secret named COPILOT_GITHUB_TOKEN in your repository settings.
      # https://github.com/settings/personal-access-tokens/new
      # User permissions
      # ✔ Read access to user copilot requests

      - name: Update wiki using Copilot agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f docs/AGENTS.md ]; then
            echo "Error: docs/AGENTS.md not found" >&2
            exit 1
          fi
          copilot -p "task Review and update the wiki files under docs/ based on the instructions in docs/AGENTS.md. Maintain consistency, update cross-references, and keep all pages current." --allow-tool='write'

      # Note: You need to configure the workflow permissions to allow GitHub Actions to create and approve pull requests. This can be done in the repository settings under Actions > General > Workflow permissions.
      # Workflow permissions
      # ✔Allow GitHub Actions to create and approve pull requests
      - name: Commit and create pull request for wiki updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="wiki-update-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -B "$BRANCH"
          git commit -m "chore: update wiki via Copilot agent [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update wiki via Copilot agent" \
            --body "Automated wiki update generated by the Copilot agent workflow." \
            --base main \
            --head "$BRANCH"
