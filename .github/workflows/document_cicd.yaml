name: Documentation Deployment CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/document_cicd.yaml'
      - "testpage/**"
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/document_cicd.yaml'
      - "testpage/**"
  workflow_dispatch:

env:
  STACKNAME_PREFIX: snngicf
  AWS_REGION: ap-northeast-3
  SAM_TEMPLATE: api/template.yaml

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - run: corepack enable

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SAM template
        run: |
          sam validate --template ${{ env.SAM_TEMPLATE }} --lint

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api/lambda
          cache-on-failure: true

      - name: Validate OpenAPI generation
        working-directory: api/lambda
        env:
          OPENAPI_OUTPUT: /tmp/openapi-validate.yaml
          API_ENDPOINT: https://placeholder.execute-api.ap-northeast-3.amazonaws.com
          USER_POOL_ID: ap-northeast-3_placeholder
          CLIENT_ID: placeholder
        run: cargo run --features openapi --bin generate-openapi

      - name: Generate API documentation
        working-directory: api/lambda
        run: cargo doc --no-deps

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: testpage/pnpm-lock.yaml

      - name: Install testpage dependencies
        working-directory: testpage
        run: pnpm i --frozen-lockfile

      - name: Lint
        working-directory: testpage
        run: pnpm run lint

      - name: Type Check
        working-directory: testpage
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Install TypeDoc
        working-directory: testpage
        run: pnpm install --save-dev typedoc

      - name: Generate testpage documentation
        working-directory: testpage
        run: pnpm exec typedoc --out ../_output/raw/testpage --entryPointStrategy expand app components

      - name: Build Storybook
        working-directory: testpage
        run: pnpm run build-storybook

      - name: Generate SVG from PlantUML files
        working-directory: docs/plantuml
        run: sh conv_from_puml_into_svg.sh

      - name: Build Next.js (with placeholder env vars)
        working-directory: testpage
        env:
          NEXT_PUBLIC_USER_POOL_ID: placeholder
          NEXT_PUBLIC_USER_POOL_CLIENT_ID: placeholder
          NEXT_PUBLIC_API_ENDPOINT: https://placeholder.execute-api.ap-northeast-3.amazonaws.com
        run: pnpm run build

  generate-api-docs:
    name: Generate API Lambda Documentation
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    # Note: You need to configure the workflow permissions to allow GitHub Actions to create Deployments. This can be done in the repository settings under Actions > General > Workflow permissions.
    permissions:      
      contents: write
      pull-requests: write
      repository-projects: write
      deployments: write
    needs: validate
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api/lambda
          cache-on-failure: true

      - name: Generate API documentation
        working-directory: api/lambda
        run: cargo doc --no-deps

      - name: Copy documentation to _output
        run: |
          mkdir -p _output/raw/api
          cp -r api/lambda/target/doc/* _output/raw/api/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: testpage/pnpm-lock.yaml

      - name: Install testpage dependencies
        working-directory: testpage
        run: pnpm i --frozen-lockfile

      - name: Install TypeDoc
        working-directory: testpage
        run: pnpm install --save-dev typedoc

      - name: Generate testpage documentation
        working-directory: testpage
        run: pnpm exec typedoc --out ../_output/raw/testpage --entryPointStrategy expand app components

      - name: Build Storybook
        working-directory: testpage
        run: pnpm run build-storybook

      - name: Copy Storybook to _output
        run: |
          mkdir -p _output/raw/storybook
          cp -r testpage/storybook-static/* _output/raw/storybook/

      - name: Generate SVG from PlantUML files
        working-directory: docs/plantuml
        run: sh conv_from_puml_into_svg.sh

      - name: Generate wiki pages
        working-directory: docs
        run: |
          echo '- <a href="/testpage/" target="_blank">テストページ</a>' >> README.md
          echo '- <a href="/raw/rapidoc/" target="_blank">API ドキュメント（RapiDoc）</a>' >> README.md
          echo '- <a href="/raw/openapi-explorer/" target="_blank">API ドキュメント（OpenAPI Explorer）</a>' >> README.md
          echo '- <a href="/raw/swagger-editor/" target="_blank">API ドキュメント（Swagger Editor）</a>' >> README.md
          echo '- <a href="/raw/scalar/" target="_blank">API ドキュメント（Scalar）</a>' >> README.md
          echo '- <a href="/raw/redoc/" target="_blank">API ドキュメント（Redoc）</a>' >> README.md
          echo '- <a href="/raw/stoplight/" target="_blank">API ドキュメント（Stoplight）</a>' >> README.md
          echo '- <a href="/raw/swaggerui/" target="_blank">API ドキュメント（SwaggerUI）</a>' >> README.md
          echo '- <a href="/raw/api/api_handler/index.html" target="_blank">バックエンドAPI ドキュメント（Rustdoc）</a>' >> README.md
          echo '- <a href="/raw/storybook/" target="_blank">テストページ ドキュメント（Storybook）</a>' >> README.md
          echo '- <a href="/raw/testpage/" target="_blank">テストページ ドキュメント（TypeDoc）</a>' >> README.md
          mkdir -p _book
          chmod -R 777 _book
          docker run --rm -v .:/honkit ghcr.io/nishidemasami/markdown-docs:v1.2.2 npx honkit build

      - name: Copy documentation to _output
        run: |
          cp -r docs/_book/* _output/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Cognito and API endpoint values
        id: cognito
        run: |
          USER_POOL_ID=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${{ env.STACKNAME_PREFIX }}-auth-${{ github.ref_name }}-CognitoUserPoolId'].Value" \
            --output text)
          echo "USER_POOL_ID=$USER_POOL_ID" >> $GITHUB_OUTPUT

          CLIENT_ID=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${{ env.STACKNAME_PREFIX }}-auth-${{ github.ref_name }}-CognitoUserPoolClientId'].Value" \
            --output text)
          echo "CLIENT_ID=$CLIENT_ID" >> $GITHUB_OUTPUT

          API_ENDPOINT=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${{ env.STACKNAME_PREFIX }}-api-${{ github.ref_name }}-HttpApiUrl-${{ github.ref_name }}'].Value" \
            --output text)
          echo "API_ENDPOINT=$API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Generate OpenAPI definition
        working-directory: api/lambda
        env:
          OPENAPI_OUTPUT: ../openapi-${{ github.ref_name }}.yaml
          API_ENDPOINT: ${{ steps.cognito.outputs.API_ENDPOINT }}
          USER_POOL_ID: ${{ steps.cognito.outputs.USER_POOL_ID }}
          CLIENT_ID: ${{ steps.cognito.outputs.CLIENT_ID }}
        run: cargo run --features openapi --bin generate-openapi

      - name: Generate OpenAPI Explorer
        run: |
          mkdir -p _output/raw/openapi-explorer
          cp api/openapi-${{ github.ref_name }}.yaml _output/raw/openapi-explorer/
          cat <<'EOF' > _output/raw/openapi-explorer/index.html
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8"/>
              <script src="https://unpkg.com/openapi-explorer/dist/browser/openapi-explorer.min.js"></script>
            </head>
            <body>
              <openapi-explorer
                spec-url="./openapi-${{ github.ref_name }}.yaml">
              </openapi-explorer>
            </body>
          </html>
          EOF

      - name: Generate Swagger Editor
        run: |
          mkdir -p _output/raw/swagger-editor
          cp api/openapi-${{ github.ref_name }}.yaml _output/raw/swagger-editor/
          cat <<'EOF' > _output/raw/swagger-editor/index.html
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8"/>
              <link rel="stylesheet" href="https://unpkg.com/swagger-editor-dist/swagger-editor.css" />
            </head>
            <body>
              <div id="swagger-editor"></div>
              <script src="https://unpkg.com/swagger-editor-dist/swagger-editor-bundle.js"></script>
              <script>
                window.onload = () => {
                  SwaggerEditorBundle({
                    url: './openapi-${{ github.ref_name }}.yaml',
                    dom_id: '#swagger-editor'
                  })
                }
              </script>
            </body>
          </html>
          EOF

      - name: Generate Scalar
        run: |
          mkdir -p _output/raw/scalar
          cp api/openapi-${{ github.ref_name }}.yaml _output/raw/scalar/
          cat <<'EOF' > _output/raw/scalar/index.html
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
            </head>

            <body>
              <!-- 先にDOMを置く -->
              <div id="app"></div>

              <!-- 後で初期化 -->
              <script>
                window.addEventListener('DOMContentLoaded', () => {
                  Scalar.createApiReference('#app', {
                    url: 'https://ngicf-testpage.pages.dev/raw/rapidoc/openapi-${{ github.ref_name }}.yaml'
                  })
                })
              </script>
            </body>
          </html>
          EOF

      - name: Generate Redoc
        run: |
          npx redoc-cli bundle \
            api/openapi-${{ github.ref_name }}.yaml \
            -o _output/raw/redoc/index.html

      - name: Generate Stoplight Elements
        run: |
          mkdir -p _output/raw/stoplight
          cp api/openapi-${{ github.ref_name }}.yaml _output/raw/stoplight/
          cat <<'EOF' > _output/raw/stoplight/index.html
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8"/>
              <script src="https://unpkg.com/@stoplight/elements/web-components.min.js"></script>
              <link rel="stylesheet" href="https://unpkg.com/@stoplight/elements/styles.min.css">
            </head>
            <body>
              <elements-api
                apiDescriptionUrl="./openapi-${{ github.ref_name }}.yaml"
                router="hash"
              />
            </body>
          </html>
          EOF

      - name: Generate SwaggerUI
        run: |
          mkdir -p _output/raw/swaggerui
          cp api/openapi-${{ github.ref_name }}.yaml _output/raw/swaggerui/
          pnpm dlx npm pack swagger-ui-dist@latest
          tar -xzf swagger-ui-dist-*.tgz --strip-components=1 -C _output/raw/swaggerui
          sed -i 's|https://petstore.swagger.io/v2/swagger.json|./openapi-${{ github.ref_name }}.yaml|g' _output/raw/swaggerui/swagger-initializer.js
          
      - name: Generate RapiDoc HTML
        run: |
          mkdir -p _output/raw/rapidoc
          cp api/openapi-${{ github.ref_name }}.yaml _output/raw/rapidoc/
          echo '<!doctype html><meta charset="utf-8"><script src="https://unpkg.com/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script><script src="https://unpkg.com/rapidoc@9.3.8/dist/rapidoc-min.js"></script><body><rapi-doc style="visibility: visible" id="doc" spec-url="./openapi-${{ github.ref_name }}.yaml" render-style="read" allow-try="true" allow-authentication="true" persist-auth="true" theme="dark" show-header="false" api-key-name="Authorization" api-key-location="header" api-key-value="eyJ..."></rapi-doc></body></html>' > _output/raw/rapidoc/index.html

      - name: Install dependencies
        working-directory: testpage
        run: pnpm i --frozen-lockfile

      - name: Build Next.js
        working-directory: testpage
        env:
          NEXT_PUBLIC_USER_POOL_ID: ${{ steps.cognito.outputs.USER_POOL_ID }}
          NEXT_PUBLIC_USER_POOL_CLIENT_ID: ${{ steps.cognito.outputs.CLIENT_ID }}
          NEXT_PUBLIC_API_ENDPOINT: ${{ steps.cognito.outputs.API_ENDPOINT }}
        run: pnpm run build

      - name: Copy documentation to _output
        run: |
          mkdir -p _output/testpage
          cp -r testpage/out/* _output/testpage/

      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'cloudflare-pages',
              required_contexts: [],
              auto_merge: false,
              description: 'Deploy to Cloudflare Pages'
            })
            core.setOutput('deployment_id', res.data.id)

      - name: Generate 404 page
        run: |
          [ -f _output/404.html ] || cat <<'EOF' > _output/404.html
          <!DOCTYPE html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>404 Not Found</title>
          <style>
          :root {
            --bg: #0f172a;
            --fg: #e2e8f0;
            --accent: #38bdf8;
            --card: rgba(255,255,255,0.06);
          }
          * { box-sizing: border-box; }
          html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 20% 20%, #1e293b, var(--bg));
            color: var(--fg);
          }
          .container {
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 1.5rem;
          }
          .card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
          }
          h1 {
            font-size: 5rem;
            margin: 0;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          }
          p {
            margin: 1rem 0 2rem;
            color: #cbd5f5;
            font-size: 1rem;
          }
          a.button {
            display: inline-block;
            padding: 0.7rem 1.4rem;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: white;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 5px 20px rgba(56,189,248,0.4);
          }
          a.button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(56,189,248,0.6);
          }
          .footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
          }
          </style>
          </head>
          <body>
          <div class="container">
            <div class="card">
              <h1>404</h1>
              <p>The page you are looking for could not be found.</p>
              <a href="/" class="button">Back to Home</a>
              <div class="footer">© NISHIDE,Masami. All rights reserved.</div>
            </div>
          </div>
          </body>
          </html>
          EOF

      - name: Deploy CloudFlare Pages
        id: deploy_pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_APITOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
          command: pages deploy _output  --project-name=${{ secrets.CLOUDFLARE_PROJECTNAME }}

      # Note: You need to configure the workflow permissions to allow GitHub Actions to create Deployments. This can be done in the repository settings under Actions > General > Workflow permissions.
      # Workflow permissions
      # ✔Read and write permissions
      - name: Output CloudFlare Pages URL
        run: |
          echo "Document URL: ${{ steps.deploy_pages.outputs.deployment-url }}"
      - name: Create GitHub Deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: '${{ steps.deploy_pages.outputs.deployment-url }}'
            })
      - name: Mark deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure'
            })
